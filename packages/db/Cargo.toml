[package]
name = "bookit-db"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.11", features = ["postgres", "r2d2", "chrono", "numeric", "uuid", "serde_json"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
chrono = { version = "0.4.45", features = ["serde"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["serde", "v4"] }
dotenvy = "0.15.7"
