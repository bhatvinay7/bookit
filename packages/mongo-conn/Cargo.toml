[package]
name = "bookit-mongo"
version = "0.1.0"
edition = "2024"

[dependencies]
mongodb  = { version = "3" }
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
bson     = { version = "2", features = ["chrono-0_4"] }
chrono   = { version = "0.4", features = ["serde"] }
tokio    = { version = "1", features = ["full"] }
anyhow   = "1"
dotenvy  = "0.15"
