[package]
name = "redis-conn"
version = "0.1.0"
edition = "2024"

[dependencies]
bb8 = "0.9.1"
bb8-redis = "0.26.0"
redis = { version = "1.5.0", features = ["tokio-comp", "tokio-native-tls-comp", "cluster-async"] }
tokio = { version = "1.53.0", features = ["full"] }
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"
async-trait = "0.1.92"
chrono = "0.4.45"
dotenvy = "0.15.7"
