[package]
name = "lock-server"
version = "0.1.0"
edition = "2024"

[dependencies]
bookit-telemetry = { version = "0.1.0", path = "../../packages/telemetry" }
tokio = { version = "1.53.0", features = ["full"] }
lapin = { version = "4.10.0", features = ["rustls"] }
rmq-conn = { version = "0.1.0", path = "../../packages/rmq-conn" }
redis-conn = { path = "../../packages/redis-conn" }
redis = { version = "1.4.1", features = ["tokio-native-tls-comp", "tokio-comp", "connection-manager"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = "0.4"
dotenvy = "0.15"
tracing = "0.1.44"
tracing-subscriber = "0.3.19"
futures = "0.3.32"
tokio-stream = "0.1.18"
rustls = { version = "0.23", features = ["ring"] }
bookit-db = { version = "0.1.0", path = "../../packages/db" }
diesel = { version = "2.3.11", features = ["postgres", "r2d2", "chrono"] }
uuid = { version = "1.15.1", features = ["v4"] }
dashmap = "6.1"

