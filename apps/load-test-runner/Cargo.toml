[package]
name = "bookit-load-test-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = "0.12"

[build-dependencies]
protoc-bin-vendored = "3.0.0"
tonic-build = "0.12"
