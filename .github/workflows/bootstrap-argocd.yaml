name: Bootstrap ArgoCD

on:
  push:
    branches: [development, main]
    paths:
      - ".github/workflows/bootstrap-argocd.yaml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to bootstrap
        required: true
        type: choice
        options:
          - development
          - production
      confirm_production:
        description: Type PROMOTE-PRODUCTION when targeting production
        required: false
        type: string

concurrency:
  group: bootstrap-argocd-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || 'development') }}
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  bootstrap-argocd:
    name: Bootstrap ArgoCD on Cluster
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || 'development') }}
    steps:
      - name: Validate environment and source branch
        env:
          TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || 'development') }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          expected_branch="development"
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            expected_branch="main"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$CONFIRM_PRODUCTION" != "PROMOTE-PRODUCTION" ]; then
              echo "Production bootstrap requires confirm_production=PROMOTE-PRODUCTION"
              exit 1
            fi
          fi
          if [ "${{ github.ref_name }}" != "$expected_branch" ]; then
            echo "Environment $TARGET_ENVIRONMENT must run from branch $expected_branch; selected branch is ${{ github.ref_name }}."
            exit 1
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GITOPS_REPO || 'bhatvinay7/bookit-k8s' }}
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          ref: ${{ github.ref_name }}

      - name: Configure kubectl
        env:
          KUBE_DATA: ${{ secrets.KUBECONFIG }}
          KUBE_DATA_SECONDARY: ${{ secrets.KUBE_CONFIG_SECONDARY }}
        run: |
          if [ -z "$KUBE_DATA" ]; then
            echo "Error: KUBECONFIG secret is not set!"
            exit 1
          fi
          mkdir -p ~/.kube

          # Check if the secret is plaintext YAML
          if printf "%s" "$KUBE_DATA" | grep -q "apiVersion:"; then
            printf "%s" "$KUBE_DATA" > ~/.kube/config
          else
            # Otherwise assume it's base64 encoded
            printf "%s" "$KUBE_DATA" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

          if [ "${{ vars.ENABLE_MULTI_REGION }}" = "true" ] && [ -n "$KUBE_DATA_SECONDARY" ]; then
            if printf "%s" "$KUBE_DATA_SECONDARY" | grep -q "apiVersion:"; then
              printf "%s" "$KUBE_DATA_SECONDARY" > ~/.kube/config-secondary
            else
              printf "%s" "$KUBE_DATA_SECONDARY" | base64 -d > ~/.kube/config-secondary
            fi
            chmod 600 ~/.kube/config-secondary
          fi

      - name: Verify kubeconfig access
        run: |
          actual_context=$(kubectl config current-context)
          actual_cluster=$(kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')
          actual_server=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')

          if [ -z "$actual_context" ] || [ -z "$actual_cluster" ] || [ -z "$actual_server" ]; then
            echo "KUBECONFIG must select a context with a cluster and API server."
            exit 1
          fi

          echo "Selected environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || 'development') }}"
          echo "Kubeconfig context:   $actual_context"
          echo "Cluster name:         $actual_cluster"
          echo "API server:           $actual_server"
          kubectl get --raw=/version >/dev/null

      - name: Install ArgoCD & Apply App of Apps
        env:
          ENABLE_MULTI_REGION: ${{ vars.ENABLE_MULTI_REGION || 'false' }}
        run: |
          if kubectl get deployment argocd-server -n argocd >/dev/null 2>&1; then
            echo "ArgoCD is already installed. Skipping installation."
          else
            echo "ArgoCD not found. Installing..."
            kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
            # Use server-side apply to avoid the 262144 byte annotation limit on huge CRDs
            kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
            
            # Wait a few seconds for CRDs to be fully registered
            sleep 10
            
            echo "Patching ArgoCD resources..."
            kubectl set resources deployment argocd-server -n argocd --limits=cpu=1000m,memory=1Gi --requests=cpu=250m,memory=256Mi
            kubectl set resources deployment argocd-repo-server -n argocd --limits=cpu=1000m,memory=1Gi --requests=cpu=250m,memory=256Mi
          fi

          # ----------------------------------------------------------------------
          # OPTIONAL: Self-Hosted High Availability Database Deployments
          # If you are not using managed cloud services for Redis/Postgres/Mongo/RMQ,
          # you can bootstrap the StatefulSets in the custom-db-ha folder.
          # Metrics exporters are included in these configurations.
          # echo "Installing Database HA StatefulSets..."
          # kubectl apply -f bookit-k8s/infra/custom-db-ha/
          # ----------------------------------------------------------------------

          echo "Installing cert-manager CRDs to prevent GitOps race conditions..."
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.crds.yaml

          echo "Installing cert-manager via Helm..."
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.13.2 \
            --set webhook.timeoutSeconds=10
            
          echo "Installing ingress-nginx with LoadBalancer configuration..."
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --version 4.10.0 \
            --set controller.service.type=LoadBalancer \
            --set controller.service.ports.http=80 \
            --set controller.service.ports.https=443 \
            --set controller.service.targetPorts.http=http \
            --set controller.service.targetPorts.https=https \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"="nlb" \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-backend-protocol"="tcp" \
            --set controller.service.externalTrafficPolicy=Local \
            --set controller.metrics.enabled=true

          echo "Installing the Sealed Secrets controller application..."
          kubectl apply -f argocd/argocd-sealed-secrets.yaml

          echo "Waiting for Sealed Secrets Controller and Registering Region Configs..."
          # Install kubeseal CLI
          wget -q https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/kubeseal-0.27.1-linux-amd64.tar.gz
          tar -xzf kubeseal-0.27.1-linux-amd64.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal

          # Argo CD reconciles the Application asynchronously. Wait for its controller
          # Deployment to be created before asking Kubernetes for its availability.
          controller_deployment=""
          for attempt in {1..90}; do
            controller_deployment=$(kubectl get deployment -n kube-system \
              -l app.kubernetes.io/name=sealed-secrets -o name 2>/dev/null | head -n 1)
            if [ -n "$controller_deployment" ]; then
              break
            fi
            echo "Waiting for Argo CD to create the Sealed Secrets controller ($attempt/90)..."
            sleep 10
          done
          if [ -z "$controller_deployment" ]; then
            echo "Sealed Secrets controller deployment was not created within 15 minutes."
            kubectl get application sealed-secrets -n argocd -o yaml || true
            exit 1
          fi
          kubectl rollout status "$controller_deployment" -n kube-system --timeout=5m
          controller_name="${controller_deployment#deployment.apps/}"

          # Create and apply the SealedSecret for region configuration from GitHub Secrets
          kubectl create secret generic stateful-region-config -n argocd \
            --from-literal=primary_region="${{ secrets.PRIMARY_REGION }}" \
            --from-literal=secondary_region="${{ secrets.SECONDARY_REGION }}" \
            --from-literal=multi_region_enabled="${{ vars.ENABLE_MULTI_REGION }}" \
            --from-literal=use_cloud_provider="${{ secrets.USE_CLOUD_PROVIDER }}" \
            --dry-run=client -o yaml | \
          kubeseal --controller-name "$controller_name" --controller-namespace kube-system --format yaml > sealed-region-config.yaml
          kubectl apply -f sealed-region-config.yaml

          echo "Labeling Primary Region in ArgoCD for StatefulServices..."
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          argocd login --core
          
          # The local cluster doesn't always have a secret out of the box until it's explicitly added or modified.
          # We add it (or update it if it exists) to ensure we can attach our custom labels.
          PRIMARY_CONTEXT=$(kubectl config current-context)
          argocd cluster add "$PRIMARY_CONTEXT" --in-cluster --yes || true
          
          argocd cluster set https://kubernetes.default.svc \
            --label deploy-stateful-services=true \
            --label environment=${{ inputs.target_environment }} \
            --label region=${{ secrets.PRIMARY_REGION }} \
            --label multi_region_enabled=${{ vars.ENABLE_MULTI_REGION }} \
            --label primary_region=${{ secrets.PRIMARY_REGION }} \
            --label secondary_region=${{ secrets.SECONDARY_REGION }} \
            --label use_cloud_provider=${{ secrets.USE_CLOUD_PROVIDER }}

          if [ "$ENABLE_MULTI_REGION" = "true" ]; then
            echo "Registering Secondary Region in ArgoCD..."
            
            SECONDARY_CONTEXT=$(kubectl config current-context --kubeconfig="$HOME/.kube/config-secondary")
            
            argocd cluster add "$SECONDARY_CONTEXT" \
              --kubeconfig "$HOME/.kube/config-secondary" \
              --label deploy-stateful-services=true \
              --label environment=${{ inputs.target_environment }} \
              --label region=${{ secrets.SECONDARY_REGION }} \
              --label multi_region_enabled=true \
              --label primary_region=${{ secrets.PRIMARY_REGION }} \
              --label secondary_region=${{ secrets.SECONDARY_REGION }} \
              --label use_cloud_provider=${{ secrets.USE_CLOUD_PROVIDER }} \
              --yes
          fi

          echo "Waiting for essential controllers (cert-manager and ingress-nginx) to be fully ready..."
          kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=5m
          kubectl wait --for=condition=Available deployment -l app.kubernetes.io/component=controller -n ingress-nginx --timeout=5m
          # Sealed Secrets was already waited on above

          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || 'development') }}" = "production" ]; then
            echo "Bootstrapping production applications from main."
            kubectl apply -f argocd/prod-apps.yaml
            kubectl apply -f argocd/stateful-applicationset.yaml
          else
            echo "Bootstrapping development applications from dev."
            kubectl apply -f argocd/dev-apps.yaml
            kubectl apply -f argocd/stateful-applicationset.yaml
          fi
