name: CI/CD & GitOps Automation

on:
  push:
    branches: [deployment1, main]
  pull_request:
    branches: [deployment1, main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - http-server
          - ws-server
          - gateway-keeper
          - lock-server
          - notification-worker
          - payment-processor
          - outbox-server
          - search-server
          - web
          - cdc-worker
env:
  REGISTRY: ghcr.io
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ci-gitops-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Node.js, Rust & Outbox
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint and Type Check TypeScript
        run: |
          npx turbo run lint
          npx turbo run check-types

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev postgresql-client

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace -- -D warnings

      - name: Link-check Rust workspace (cargo check)
        run: cargo check --workspace --all-targets

      # These tests do not require live PostgreSQL, Redis, or RabbitMQ services.
      # Keep them enabled even while the older environment-backed suite is paused.
      - name: Test transactional outbox and payment idempotency
        run: |
          cargo test -p outbox-server --test outbox_policy
          cargo test -p payment-processor --test payload_parsing
          cargo test -p http-server --test payment_idempotency

      # Temporarily disabled as the redis tests are causing errors
      # - name: Prepare Rust test environment
      #   env:
      #     TEST_REDIS_URL: ${{ vars.TEST_REDIS_URL || secrets.TEST_REDIS_URL || 'redis://127.0.0.1:6379' }}
      #   run: |
      #     cat > .env.test <<EOF
      #     TEST_REDIS_URL=${TEST_REDIS_URL}
      #     EOF
      #
      # - name: Run Rust workspace tests
      #   env:
      #     TEST_REDIS_URL: ${{ vars.TEST_REDIS_URL || secrets.TEST_REDIS_URL || 'redis://127.0.0.1:6379' }}
      #   run: cargo test --workspace --all-targets

  detect-changes:
    name: Detect Changed Workspace Services
    runs-on: ubuntu-22.04
    outputs:
      services: ${{ steps.resolve.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need at least 2 commits so paths-filter can diff HEAD vs HEAD~1 on push events
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # If the CI pipeline itself changes → rebuild everything
            ci:
              - '.github/workflows/**'

            http-server:
              - 'apps/http-server/**'
              - 'packages/db/**'
              - 'packages/rmq-conn/**'
              - 'packages/redis-conn/**'
              - 'packages/mongo-conn/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ws-server:
              - 'apps/ws-server/**'
              - 'packages/redis-conn/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            gateway-keeper:
              - 'apps/gateway-keeper/**'
              - 'packages/rmq-conn/**'
              - 'packages/redis-conn/**'
              - 'packages/proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            lock-server:
              - 'apps/lock-server/**'
              - 'packages/rmq-conn/**'
              - 'packages/redis-conn/**'
              - 'packages/db/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            notification-worker:
              - 'apps/notification-worker/**'
              - 'packages/rmq-conn/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            payment-processor:
              - 'apps/payment-processor/**'
              - 'packages/rmq-conn/**'
              - 'packages/db/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            outbox-server:
              - 'apps/outbox-server/**'
              - 'packages/rmq-conn/**'
              - 'packages/db/**'
              - 'packages/telemetry/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            search-server:
              - 'apps/search-server/**'
              - 'packages/rmq-conn/**'
              - 'packages/proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            cdc-worker:
              - 'apps/cdc-worker/**'
              - 'packages/db/**'
              - 'packages/redis-conn/**'
              - 'packages/mongo-conn/**'
              - 'packages/rmq-conn/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Resolve services to build
        id: resolve
        shell: bash
        run: |
          ALL_SERVICES='["http-server","ws-server","gateway-keeper","lock-server","notification-worker","payment-processor","outbox-server","search-server","web","cdc-worker"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.service }}" = "all" ]; then
              echo "Manual trigger: rebuilding all services"
              echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            else
              echo "Manual trigger: rebuilding ${{ inputs.service }}"
              json=$(printf '%s\n' "${{ inputs.service }}" | jq -R . | jq -s -c .)
              echo "services=$json" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # If the CI/CD pipeline file itself changed → rebuild every service
          if [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            echo "CI pipeline changed: rebuilding all services"
            echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise collect only the services whose source files changed
          services=()
          if [ "${{ steps.filter.outputs.http-server }}" = "true" ];        then services+=("http-server"); fi
          if [ "${{ steps.filter.outputs.ws-server }}" = "true" ];          then services+=("ws-server"); fi
          if [ "${{ steps.filter.outputs.gateway-keeper }}" = "true" ];     then services+=("gateway-keeper"); fi
          if [ "${{ steps.filter.outputs.lock-server }}" = "true" ];        then services+=("lock-server"); fi
          if [ "${{ steps.filter.outputs.notification-worker }}" = "true" ]; then services+=("notification-worker"); fi
          if [ "${{ steps.filter.outputs.payment-processor }}" = "true" ];  then services+=("payment-processor"); fi
          if [ "${{ steps.filter.outputs['outbox-server'] }}" = "true" ];   then services+=("outbox-server"); fi
          if [ "${{ steps.filter.outputs.search-server }}" = "true" ];      then services+=("search-server"); fi
          if [ "${{ steps.filter.outputs.web }}" = "true" ];                then services+=("web"); fi

          if [ ${#services[@]} -eq 0 ]; then
            echo "No relevant service files changed — skipping build"
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s -c .)
            echo "services=$json" >> "$GITHUB_OUTPUT"
            echo "Building changed services: ${services[*]}"
          fi

  build-and-push:
    name: Build & Push Docker Images
    needs: [validate, detect-changes]
    # Dev builds the immutable artifacts. Main and pull requests validate only;
    # production reuses a tested dev digest through promote-production.yaml.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/deployment1' &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-22.04
    environment: development
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bookit-${{ matrix.service }}
          tags: |
            type=sha,prefix=commit-

      - name: Verify service Docker build definition
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          test -f "apps/${SERVICE}/Dockerfile" || {
            echo "Missing apps/${SERVICE}/Dockerfile"
            exit 1
          }

      - name: Build and push Multi-Stage image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_BASE_URL=${{ secrets.NEXT_PUBLIC_WS_BASE_URL }}
            NEXT_PUBLIC_SEARCH_API_URL=${{ secrets.NEXT_PUBLIC_SEARCH_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

  update-gitops-tags:
    name: Update ArgoCD GitOps Manifests
    needs: [build-and-push, detect-changes]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/deployment1' &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-22.04
    environment: development
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GITOPS_REPO || 'bhatvinay7/bookit-k8s' }}
          # GITOPS_TOKEN must be a PAT with 'contents: write' access to bookit-k8s
          # GITHUB_TOKEN only works on the current repo and will 404 on external repos
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          path: gitops-repo
          ref: deployment1

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags in kustomization.yaml for changed services
        working-directory: gitops-repo
        env:
          # KUSTOMIZE_DIR: path inside bookit-k8s repo containing kustomization.yaml
          # Based on bookit-k8s repo structure: apps/ directory holds kustomization.yaml
          KUSTOMIZE_DIR: apps/overlays/dev
        run: |
          # Try explicit path first, then fallback to dynamic discovery
          if [ -f "${KUSTOMIZE_DIR}/kustomization.yaml" ] || [ -f "${KUSTOMIZE_DIR}/kustomization.yml" ]; then
            echo "Using KUSTOMIZE_DIR: ${KUSTOMIZE_DIR}"
            cd "${KUSTOMIZE_DIR}"
          else
            echo "'${KUSTOMIZE_DIR}' not found, scanning repo..."
            KUSTOMIZATION_PATH=$(find . -type f \( -name "kustomization.yaml" -o -name "kustomization.yml" \) \
              | sort | head -n 1)
            if [ -n "$KUSTOMIZATION_PATH" ]; then
              echo "Found kustomization at: $KUSTOMIZATION_PATH"
              cd "$(dirname "$KUSTOMIZATION_PATH")"
            else
              echo "ERROR: No kustomization.yaml found in bookit-k8s repo. Files present:"
              find . -type f | sort
              exit 1
            fi
          fi

          echo "Running kustomize in: $(pwd)"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="commit-${SHORT_SHA}"

          # Only update image tags for services that actually changed and were built
          SERVICES=$(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]')

          for svc in $SERVICES; do
            IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository_owner }}/bookit-${svc}"
            # Ensure the image name is strictly lowercase as required by Docker registries
            IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            echo "Updating image tag for bookit-${svc} to ${TAG}"
            kustomize edit set image "bookit-${svc}=${IMAGE_NAME}:${TAG}"
          done

      - name: Validate rendered GitOps deployment
        working-directory: gitops-repo
        env:
          DEPLOY_ENV: dev
        run: |
          for region in us-east; do
            target="apps/regions/${DEPLOY_ENV}/${region}"
            rendered=$(mktemp)
            kustomize build "$target" > "$rendered"
            grep -q 'name: outbox-server' "$rendered" || {
              echo "Rendered manifest is missing outbox-server for ${DEPLOY_ENV}/${region}."
              exit 1
            }
            grep -q 'name: migrate-payment-outbox' "$rendered" || {
              echo "Rendered manifest is missing the outbox migration init container."
              exit 1
            }
            grep -q 'name: RABBITMQ_URL' "$rendered" || {
              echo "Rendered outbox deployment is missing its RabbitMQ secret reference."
              exit 1
            }
            rm "$rendered"
          done

      - name: Commit and push GitOps tag updates
        working-directory: gitops-repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -- apps/overlays/dev/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): update image tags to commit-$(echo '${{ github.sha }}' | cut -c1-7) [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:deployment1; then
                exit 0
              fi
              git fetch origin deployment1
              git rebase origin/deployment1
            done
            echo "Could not push image tags after three attempts."
            exit 1
          else
            echo "No image tag changes to commit."
          fi
