name: Manual Rust Lock Load Test

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Sustained Job duration (5m through 4h)"
        required: true
        type: string
        default: 10m
      target_rps:
        description: "Global lock attempts per second (1-5000)"
        required: true
        type: string
        default: "50"
      grpc_payload:
        description: "LockSlot JSON for one isolated, free development schedule/seat"
        required: true
        type: string
      lock_concurrency:
        description: "Independent gRPC connections/workers in the Kubernetes Job (1-5000)"
        required: true
        type: string
        default: "500"
      rust_runner_threads:
        description: "Tokio runtime worker threads in the Kubernetes Job (1-32)"
        required: true
        type: string
        default: "4"

concurrency:
  group: manual-rust-lock-load-deployment1
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  rust-lock-load:
    name: Rust lock Job against deployment1
    runs-on: ubuntu-22.04
    environment: development
    timeout-minutes: 300
    env:
      GRPC_SERVER_URL: ${{ secrets.GRPC_SERVER_URL || secrets.GATEWAY_KEEPER_GRPC_URL }}
      KUBE_DATA: ${{ secrets.KUBECONFIG }}
      TEST_DURATION: ${{ inputs.duration }}
      TEST_TARGET_RPS: ${{ inputs.target_rps }}
      GRPC_PAYLOAD: ${{ inputs.grpc_payload }}
      LOCK_CONCURRENCY: ${{ inputs.lock_concurrency }}
      RUST_RUNNER_THREADS: ${{ inputs.rust_runner_threads }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated development load profile
        run: |
          if [ "${{ github.ref_name }}" != deployment1 ]; then
            echo "Rust lock tests may run only from deployment1."
            exit 1
          fi
          if [[ "$TEST_DURATION" =~ ^([5-9]|[1-9][0-9]+)m$ ]] || [[ "$TEST_DURATION" =~ ^[1-4]h$ ]]; then
            :
          else
            echo "duration must be between 5m and 4h."
            exit 1
          fi
          for setting in TEST_TARGET_RPS LOCK_CONCURRENCY; do
            value=${!setting}
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]] || [ "$value" -gt 5000 ]; then
              echo "$setting must be between 1 and 5000."
              exit 1
            fi
          done
          if ! [[ "$RUST_RUNNER_THREADS" =~ ^[1-9][0-9]*$ ]] || [ "$RUST_RUNNER_THREADS" -gt 32 ]; then
            echo "rust_runner_threads must be between 1 and 32."
            exit 1
          fi
          if [ -z "$GRPC_SERVER_URL" ] || [ -z "$GRPC_PAYLOAD" ]; then
            echo "GRPC_SERVER_URL and grpc_payload are required."
            exit 1
          fi

      - uses: azure/setup-kubectl@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the immutable Rust lock Job image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/load-test-runner/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bookit-load-test-runner:commit-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Kubernetes access
        run: |
          if [ -z "$KUBE_DATA" ]; then
            echo "KUBECONFIG must be configured in the development environment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_DATA" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBE_DATA" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_DATA" | base64 --decode > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl get --raw=/version >/dev/null
          kubectl -n bookit get hpa

      - name: Record pre-test autoscaler state
        run: |
          mkdir -p load-test-results/cluster-evidence
          kubectl -n bookit get hpa,deploy,pods -o wide | tee load-test-results/pre-test-state.txt
          kubectl top pods -n bookit | tee load-test-results/pre-test-pod-usage.txt || true

      - name: Collect HPA, pod, and Gateway Keeper endpoint evidence
        run: |
          nohup ./load-tests/collect-cluster-evidence.sh \
            > load-test-results/cluster-evidence/collector.log 2>&1 &
          echo $! > load-test-results/cluster-evidence/collector.pid

      - name: Run Rust multithreaded lock Job in Kubernetes
        run: |
          case "$TEST_DURATION" in
            *m) duration_seconds=$(( ${TEST_DURATION%m} * 60 )) ;;
            *h) duration_seconds=$(( ${TEST_DURATION%h} * 3600 )) ;;
            *) echo "unsupported validated duration: $TEST_DURATION"; exit 1 ;;
          esac
          job_name="bookit-rust-lock-${{ github.run_id }}"
          runner_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/bookit-load-test-runner:commit-${GITHUB_SHA}"
          printf '%s' "$GRPC_PAYLOAD" > load-test-results/rust-lock-payload.json
          kubectl -n bookit create configmap manual-load-test-config \
            --from-literal=LOAD_TEST_GRPC_TARGET="$GRPC_SERVER_URL" \
            --from-file=LOAD_TEST_GRPC_PAYLOAD=load-test-results/rust-lock-payload.json \
            --from-literal=LOAD_TEST_RPS="$TEST_TARGET_RPS" \
            --from-literal=LOAD_TEST_DURATION_SECONDS="$duration_seconds" \
            --from-literal=LOAD_TEST_CONCURRENCY="$LOCK_CONCURRENCY" \
            --from-literal=LOAD_TEST_THREADS="$RUST_RUNNER_THREADS" \
            --from-literal=LOAD_TEST_RUN_ID="${{ github.run_id }}" \
            --from-literal=LOAD_TEST_PUSHGATEWAY_URL="http://load-test-pushgateway.monitoring.svc.cluster.local:9091" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n bookit get cronjob/bookit-rust-lock-load >/dev/null
          kubectl -n bookit create job "$job_name" --from=cronjob/bookit-rust-lock-load --dry-run=client -o yaml \
            | sed "s|image: .*bookit-load-test-runner:.*|image: ${runner_image}|" \
            | kubectl apply -f -
          set +e
          kubectl -n bookit wait --for=condition=complete "job/${job_name}" --timeout="$((duration_seconds + 600))s"
          job_status=$?
          set -e
          kubectl -n bookit logs "job/${job_name}" --all-containers=true > load-test-results/rust-lock-job.log 2>&1 || true
          kubectl -n bookit get "job/${job_name}" -o yaml > load-test-results/rust-lock-job.yaml || true
          kubectl -n bookit get pods -l job-name="$job_name" -o yaml > load-test-results/rust-lock-pod.yaml || true
          exit "$job_status"

      - name: Record post-test autoscaler state
        if: always()
        run: |
          kubectl -n bookit get hpa,deploy,pods -o wide | tee load-test-results/post-test-state.txt || true
          kubectl top pods -n bookit | tee load-test-results/post-test-pod-usage.txt || true
          kubectl -n bookit get hpa -o json > load-test-results/cluster-evidence/hpa-post-test.json || true
          kubectl -n bookit get pods -o json > load-test-results/cluster-evidence/pods-post-test.json || true
          kubectl -n bookit get endpointslices -l kubernetes.io/service-name=gateway-keeper -o json \
            > load-test-results/cluster-evidence/gateway-keeper-endpoints-post-test.json || true

      - name: Stop cluster evidence collection
        if: always()
        run: |
          if [ -f load-test-results/cluster-evidence/collector.pid ]; then
            kill "$(cat load-test-results/cluster-evidence/collector.pid)" 2>/dev/null || true
          fi

      - name: Remove disposable Job configuration
        if: always()
        run: kubectl -n bookit delete configmap manual-load-test-config --ignore-not-found

      - name: Upload Rust load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lock-load-${{ github.run_id }}
          path: load-test-results/
          if-no-files-found: warn
