services:
  gateway-keeper:
    build:
      context: .
      dockerfile: apps/gateway-keeper/Dockerfile
    env_file:
      - apps/gateway-keeper/.env
    environment:
      HTTP_SERVER_URL: http://http-server:8082
      SEARCH_SERVER_GRPC_URL: http://search-server:50051
      GATEWAY_KEEPER_GRPC_ADDR: 0.0.0.0:50052
    ports:
      - "8080:8080"
      - "50052:50052"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      - http-server
      - search-server

  lock-server:
    build:
      context: .
      dockerfile: apps/lock-server/Dockerfile
    env_file:
      - apps/lock-server/.env
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile
    env_file:
      - apps/ws-server/.env
    environment:
      GATEWAY_KEEPER_GRPC_URL: http://gateway-keeper:50052
    ports:
      - "8081:8081"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      - gateway-keeper

  http-server:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile
    env_file:
      - apps/http-server/.env
    ports:
      - "8082:8082"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  search-server:
    build:
      context: .
      dockerfile: apps/search-server/Dockerfile
    env_file:
      - apps/search-server/.env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8084:8084"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    depends_on:
      - elasticsearch

  elasticsearch:
    build:
      context: .
      dockerfile: apps/elasticsearch/Dockerfile
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  payment-processor:
    build:
      context: .
      dockerfile: apps/payment-processor/Dockerfile
    env_file:
      - apps/payment-processor/.env
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  cdc-worker:
    build:
      context: .
      dockerfile: apps/cdc-worker/Dockerfile
    env_file:
      - apps/cdc-worker/.env
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  notification-worker:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    env_file:
      - apps/notification-worker/.env
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

