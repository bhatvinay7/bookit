services:
  gateway-keeper:
    build:
      context: .
      dockerfile: apps/gateway-keeper/Dockerfile
    env_file:
      - apps/gateway-keeper/.env
    ports:
      - "8080:8080"
      - "50052:50052"
    restart: always

  lock-server:
    build:
      context: .
      dockerfile: apps/lock-server/Dockerfile
    env_file:
      - apps/lock-server/.env
    restart: always

  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile
    env_file:
      - apps/ws-server/.env
    ports:
      - "8081:8081"
    restart: always

  http-server:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile
    env_file:
      - apps/http-server/.env
    ports:
      - "8082:8082"
    restart: always

  search-server:
    build:
      context: .
      dockerfile: apps/search-server/Dockerfile
    env_file:
      - apps/search-server/.env
    ports:
      - "8084:8084"
    restart: always
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: always

  payment-processor:
    build:
      context: .
      dockerfile: apps/payment-processor/Dockerfile
    env_file:
      - apps/payment-processor/.env
    restart: always

  cdc-worker:
    build:
      context: .
      dockerfile: apps/cdc-worker/Dockerfile
    env_file:
      - apps/cdc-worker/.env
    restart: always

  notification-worker:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    env_file:
      - apps/notification-worker/.env
    restart: always

